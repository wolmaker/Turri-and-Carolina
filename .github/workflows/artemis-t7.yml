name: Artemis T7 (vibracion GameSir)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Descargar Artemis original
        run: |
          git clone https://github.com/ClassicOldSong/moonlight-android.git artemis
          cd artemis
          git checkout c5cf27f
          git submodule update --init --recursive

      - name: Aplicar arreglo para GameSir T7
        working-directory: artemis
        run: |
          echo '' | base64 -d > t7.patch
          git apply t7.patch
          git diff --stat

      - name: Instalar Android NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" > /dev/null

      - name: Compilar APK
        working-directory: artemis
        run: |
          chmod +x gradlew
          ./gradlew assembleNonRoot_gameDebug --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Artemis-T7-APK
          path: artemis/app/build/outputs/apk/**/*.apk
