name: Carolina (etapa 1)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar este repositorio (contiene el parche)
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Descargar Artemis original
        run: |
          git clone https://github.com/ClassicOldSong/moonlight-android.git artemis
          cd artemis
          git checkout c5cf27f
          git submodule update --init --recursive

      - name: Aplicar cambios de Carolina
        working-directory: artemis
        run: |
          git apply --whitespace=nowarn ../repo/carolina-etapa1.patch
          git status --short | head -40

      - name: Instalar Android NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" > /dev/null

      - name: Compilar APK
        working-directory: artemis
        run: |
          chmod +x gradlew
          ./gradlew assembleNonRoot_gameDebug --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Carolina-APK
          path: artemis/app/build/outputs/apk/**/*.apk
