name: Carolina

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar este repositorio (contiene el parche)
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Descargar Artemis original
        run: |
          git clone https://github.com/ClassicOldSong/moonlight-android.git artemis
          cd artemis
          git checkout c5cf27f
          git submodule update --init --recursive

      - name: Aplicar cambios de Carolina (carolina.patch)
        working-directory: artemis
        run: |
          git apply --whitespace=nowarn ../repo/carolina.patch
          git status --short | head -40

      - name: Instalar Android NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" > /dev/null

      - name: Preparar la firma oficial (desde los secretos del repositorio)
        env:
          KEYSTORE_B64: ${{ secrets.CAROLINA_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.CAROLINA_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No hay secreto CAROLINA_KEYSTORE_BASE64: el APK se firma con una clave de prueba (no oficial)."
            exit 0
          fi
          # quitar espacios / saltos de linea que se cuelan al copiar y pegar
          PASS="$(printf '%s' "$KEYSTORE_PASS" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          echo "::add-mask::$PASS"
          printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/carolina.jks"
          # diagnostico (no muestra ningun secreto)
          B64LEN=$(printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n' | wc -c)
          echo "Largo del texto de la clave: $B64LEN caracteres (deberia ser 5756)"
          echo "Largo de la contrasena: ${#PASS} caracteres (deberia ser 24)"
          echo "Tamano del archivo de clave: $(wc -c < "$RUNNER_TEMP/carolina.jks") bytes (deberia ser 4316 aprox.)"
          if ! OUT=$(keytool -list -keystore "$RUNNER_TEMP/carolina.jks" -storepass "$PASS" -alias carolina 2>&1); then
            echo "$OUT" | grep -v -i "storepass" | head -5
            echo "::error::La contrasena del secreto CAROLINA_KEYSTORE_PASSWORD no coincide con la clave (o CAROLINA_KEYSTORE_BASE64 esta incompleto). Vuelve a pegarlos."
            exit 1
          fi
          {
            echo "CAROLINA_KEYSTORE=$RUNNER_TEMP/carolina.jks"
            echo "CAROLINA_STORE_PASSWORD=$PASS"
            echo "CAROLINA_KEY_PASSWORD=$PASS"
            echo "CAROLINA_KEY_ALIAS=carolina"
          } >> "$GITHUB_ENV"
          echo "Firma oficial de Carolina: SI"

      - name: Compilar APK
        working-directory: artemis
        run: |
          chmod +x gradlew
          ./gradlew assembleNonRoot_gameDebug --no-daemon

      - name: Borrar la clave de la maquina
        if: always()
        run: rm -f "$RUNNER_TEMP/carolina.jks"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Carolina-APK
          path: artemis/app/build/outputs/apk/**/*.apk
