name: Turri

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: No convertir saltos de linea (necesario para aplicar el parche)
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Descargar este repositorio (contiene turri.patch)
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar herramientas de compilacion (MSYS2)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            git
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-curl-winssl
            mingw-w64-ucrt-x86_64-MinHook
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-nsis
            mingw-w64-ucrt-x86_64-onevpl
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-ninja

      - name: Descargar Apollo original
        run: |
          git clone https://github.com/ClassicOldSong/Apollo.git apollo
          cd apollo
          git checkout v0.4.6
          git submodule update --init --recursive

      - name: Aplicar cambios de Turri
        run: |
          cd apollo
          git apply --whitespace=nowarn ../repo/turri.patch
          git status --short | head -20

      - name: Agregar driver de pantalla virtual (SudoVDA) del instalador oficial de Apollo 0.4.6
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/ClassicOldSong/Apollo/releases/download/v0.4.6/Apollo-0.4.6.exe" -OutFile apollo046.exe
          & "C:\Program Files\7-Zip\7z.exe" x apollo046.exe -oapollo046 -y | Out-Null
          $nef = Get-ChildItem -Recurse apollo046 -Filter nefconc.exe | Select-Object -First 1
          if (-not $nef) { throw "No se encontro nefconc.exe en el instalador de Apollo" }
          Get-ChildItem $nef.DirectoryName
          Copy-Item "$($nef.DirectoryName)\*" "apollo\src_assets\windows\drivers\sudovda\" -Force
          Get-ChildItem apollo\src_assets\windows\drivers\sudovda

      - name: Compilar
        env:
          BRANCH: master
          BUILD_VERSION: "0.4.6"
          COMMIT: 0cd32ab
        run: |
          cd apollo
          node --version
          cmake -B build -G Ninja -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_DOCS=OFF -DBUILD_TESTS=OFF -DSUNSHINE_ASSETS_DIR=assets
          ninja -C build

      - name: Crear instalador
        run: |
          cd apollo/build
          cpack -G NSIS --config ./CPackConfig.cmake
          find . -maxdepth 3 -name "*.exe" -newer CMakeCache.txt | head

      - name: Subir instalador
        uses: actions/upload-artifact@v4
        with:
          name: Turri-instalador
          path: |
            apollo/build/cpack_artifacts/*.exe
            apollo/build/Turri*.exe
          if-no-files-found: error
